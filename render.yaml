services:
  - type: web
    name: urkufood-api
    runtime: node
    rootDir: backend
    plan: free
    autoDeploy: true
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /
    envVars:
      - key: NODE_OPTIONS
        value: --max-old-space-size=160
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: PUBLIC_BASE_URL
        sync: false
      - key: UPLOADS_DIR
        value: /tmp/urkufood-uploads
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: false
      - key: SMTP_TLS_REJECT_UNAUTHORIZED
        value: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: FCM_PROJECT_ID
        sync: false
      - key: FCM_CLIENT_EMAIL
        sync: false
      - key: FCM_PRIVATE_KEY
        sync: false
      - key: WHATSAPP_ENABLED
        value: true
      - key: WHATSAPP_ALLOW_RENDER
        value: true
      - key: WHATSAPP_PHONE_DEFAULT_CC
        value: '57'
      - key: WHATSAPP_CONNECT_DELAY_MS
        value: '8000'
      - key: WHATSAPP_READY_WAIT_MS
        value: '90000'
      - key: WHATSAPP_FROM
        value: La Carta Bot
      - key: WHATSAPP_SESSION_DIR
        value: /tmp/urkufood-wwebjs-session
      - key: WHATSAPP_CHROME_PATH
        sync: false
      - key: WHATSAPP_NOTIFY_TO
        value: ''
      - key: WHATSAPP_TEST_RECIPIENT
        value: ''
      - key: WHATSAPP_AUTO_REPLY_ENABLED
        value: false
      - key: WHATSAPP_AUTO_REPLY_TEXT
        value: Hola, recibimos tu mensaje en URKUfood. En breve validamos tu pedido o consulta.